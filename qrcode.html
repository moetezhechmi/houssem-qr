<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#f5f2e9"/>
  <title>QR Code Bieny — Menu</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f2e9;
      color: #253e31;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 0, #e6eee6 0, #f5f2e9 65%);
    }

    main {
      width: min(100%, 560px);
      text-align: center;
    }

    .qr-image {
      display: block;
      width: min(100%, 500px);
      height: auto;
      margin: 0 auto;
      border-radius: 22px;
      box-shadow: 0 24px 64px rgba(37, 62, 49, .14);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .action {
      min-height: 46px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid #d6e0d4;
      border-radius: 999px;
      background: #fffdf8;
      color: #355743;
      font: inherit;
      font-size: .88rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform .18s ease, background-color .18s ease;
    }

    .action:hover { transform: translateY(-2px); background: #fff; }
    .action:focus-visible { outline: 3px solid #92b29d; outline-offset: 3px; }

    .action-primary {
      border-color: #355743;
      background: #355743;
      color: #fffdf8;
    }

    .action-primary:hover { background: #253e31; }

    @media print {
      @page { size: 150mm 150mm; margin: 0; }

      html, body {
        width: 150mm;
        height: 150mm;
        min-height: 0;
        margin: 0;
        padding: 0;
        background: #fff;
      }

      main { width: 150mm; }
      .qr-image {
        width: 150mm;
        height: 150mm;
        border-radius: 0;
        box-shadow: none;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .actions { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <img
      class="qr-image"
      src="bieny-qr-menu.png"
      alt="QR code Bieny avec le logo officiel, pour ouvrir le menu"
      width="1600"
      height="1600"
    />
    <nav class="actions" aria-label="Actions du QR code">
      <a class="action action-primary" href="bieny-qr-menu.png" download="bieny-qr-menu.png">
        Télécharger PNG
      </a>
      <a class="action" href="bieny-qr-menu.svg" download="bieny-qr-menu.svg">
        Télécharger SVG
      </a>
      <button class="action" type="button" onclick="window.print()">
        Imprimer
      </button>
    </nav>
  </main>
</body>
</html>
