<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Bieny — QR Code</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f5f2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      background: #fff;
      border-radius: 32px;
      padding: 48px 40px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.10);
      position: relative;
      overflow: hidden;
    }

    /* top sage band */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 8px;
      background: linear-gradient(90deg, #5E8A74, #8FAF9A, #5E8A74);
    }

    /* logo */
    .logo-wrap {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: #8FAF9A;
      margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(94,138,116,.35);
      overflow: hidden;
    }
    .logo-wrap img {
      width: 76px; height: 76px;
      object-fit: contain;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: #2C1E16;
      letter-spacing: .03em;
      margin-bottom: 4px;
    }
    .brand-sub {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #8a7060;
      margin-bottom: 6px;
    }
    .slogan {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: .88rem;
      color: #a89888;
      margin-bottom: 28px;
    }

    /* divider */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 28px;
    }
    .divider-line { flex:1; height:1px; background:#E6D5C3; }
    .divider-leaf { color: #8FAF9A; font-size: .9rem; }

    /* QR wrapper */
    .qr-wrap {
      position: relative;
      display: inline-block;
      padding: 16px;
      background: #FAF9F6;
      border-radius: 20px;
      border: 2px solid #E6D5C3;
      margin-bottom: 24px;
    }
    #qrCanvas {
      display: block;
      border-radius: 10px;
    }

    /* center logo overlay on QR */
    .qr-logo {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 52px; height: 52px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .qr-logo img {
      width: 44px; height: 44px;
      object-fit: contain;
    }

    .url-box {
      background: #eef4f0;
      border-radius: 12px;
      padding: 10px 16px;
      font-size: .78rem;
      font-weight: 600;
      color: #5E8A74;
      letter-spacing: .03em;
      word-break: break-all;
      margin-bottom: 28px;
    }

    .instructions {
      font-size: .78rem;
      color: #a89888;
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .instructions strong { color: #4a3728; }

    /* buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      flex: 1;
      padding: 13px 16px;
      border-radius: 50px;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: all .2s;
    }
    .btn-primary {
      background: #2C1E16;
      color: #FAF9F6;
    }
    .btn-primary:hover { background: #4a3020; transform: translateY(-2px); }

    .btn-secondary {
      background: #eef4f0;
      color: #5E8A74;
      border: 1.5px solid #c8ddd1;
    }
    .btn-secondary:hover { background: #c8ddd1; transform: translateY(-2px); }

    /* footer */
    .footer-text {
      margin-top: 24px;
      font-size: .68rem;
      color: #c8b8a8;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    @media print {
      body { background: white; padding: 0; }
      .card { box-shadow: none; border: 1px solid #eee; }
      .btn-row { display: none; }
    }
  </style>
</head>
<body>

<div class="card" id="printCard">

  <div class="logo-wrap">
    <img src="logo_houssem.jpeg" alt="Bieny"/>
  </div>

  <p class="brand">Bieny</p>
  <p class="brand-sub">Coffeeshop · Djerba Midoun</p>
  <p class="slogan">« Every cup tells a story. »</p>

  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-leaf">✦</span>
    <div class="divider-line"></div>
  </div>

  <div class="qr-wrap">
    <canvas id="qrCanvas"></canvas>
    <div class="qr-logo">
      <img src="logo_houssem.jpeg" alt="Bieny"/>
    </div>
  </div>

  <div class="url-box">houssem-qr.onrender.com/qr</div>

  <p class="instructions">
    <strong>Scannez ce QR Code</strong> avec votre téléphone<br/>
    pour découvrir notre menu et nous suivre<br/>
    sur les réseaux sociaux.
  </p>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="downloadQR()">⬇ Télécharger</button>
    <button class="btn btn-secondary" onclick="window.print()">🖨 Imprimer</button>
  </div>

  <p class="footer-text">Bieny Coffee · Good Drinks · Good Vibes</p>

</div>

<script>
  const URL_TARGET = 'https://houssem-qr.onrender.com/qr';

  QRCode.toCanvas(
    document.getElementById('qrCanvas'),
    URL_TARGET,
    {
      width: 260,
      margin: 1,
      color: {
        dark:  '#2C1E16',   // espresso
        light: '#FAF9F6'    // off-white
      },
      errorCorrectionLevel: 'H'   // high — needed for center logo overlay
    },
    function(err) {
      if (err) console.error(err);
    }
  );

  function downloadQR() {
    const canvas = document.getElementById('qrCanvas');
    // Create a high-res export canvas with branding
    const exp = document.createElement('canvas');
    exp.width  = 800;
    exp.height = 920;
    const ctx = exp.getContext('2d');

    // Background
    ctx.fillStyle = '#FAF9F6';
    ctx.fillRect(0, 0, 800, 920);

    // Top sage band
    const grad = ctx.createLinearGradient(0,0,800,0);
    grad.addColorStop(0,   '#5E8A74');
    grad.addColorStop(0.5, '#8FAF9A');
    grad.addColorStop(1,   '#5E8A74');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 800, 16);

    // QR code (scaled up)
    ctx.drawImage(canvas, 130, 80, 540, 540);

    // Brand text
    ctx.textAlign = 'center';
    ctx.fillStyle = '#2C1E16';
    ctx.font = 'bold 56px serif';
    ctx.fillText('BIENY', 400, 680);

    ctx.fillStyle = '#8a7060';
    ctx.font = '500 22px Inter, sans-serif';
    ctx.fillText('COFFEESHOP · DJERBA MIDOUN', 400, 716);

    ctx.fillStyle = '#a89888';
    ctx.font = 'italic 20px serif';
    ctx.fillText('« Every cup tells a story. »', 400, 752);

    ctx.fillStyle = '#5E8A74';
    ctx.font = '600 18px Inter, sans-serif';
    ctx.fillText('houssem-qr.onrender.com/qr', 400, 800);

    // Bottom band
    ctx.fillStyle = grad;
    ctx.fillRect(0, 880, 800, 40);

    // Download
    const link = document.createElement('a');
    link.download = 'bieny-qrcode.png';
    link.href = exp.toDataURL('image/png', 1.0);
    link.click();
  }
</script>

</body>
</html>
